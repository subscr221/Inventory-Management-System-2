# pgBackRest configuration for the staging pilot. Baked into the image by
# deploy/compose/Dockerfile.postgres and read at /etc/pgbackrest.conf.
#
# Two details here are load-bearing on pgBackRest 2.59 and were each verified against the running
# container rather than assumed:
#
#  1. The pg1-* options live INSIDE [main], not in a separate [main:pg1] section. With a
#     conventional [main:pg1] section this build resolves repo1-* (confirmed in its debug log, which
#     echoes --repo1-path from the file) but never binds the cluster options, so every command dies
#     with "requires option: pg1-path" / "missing stanza path". Declaring them in [main] resolves
#     the stanza and stanza-create succeeds.
#
#  2. The file must be at /etc/pgbackrest.conf, owned postgres:postgres, mode 0640. That is the
#     path the Debian pgbackrest package uses. /etc/pgbackrest/pgbackrest.conf is never read on
#     this build, which is why an otherwise valid config there was silently ignored.
#
# Corrections against the previous revision of this file, each confirmed against the box on
# 2026-10-03:
#   - pg1-path was /var/lib/postgresql/data, which does not exist on postgres:18.x. The
#     authoritative data_directory reported by 'show data_directory' is
#     /var/lib/postgresql/18/docker, the same major-version subdirectory the compose comments
#     already document for postgres-standby.
#   - repo1-cipher-type=aes-256-cbc was set with no repo1-cipher-pass. pgBackRest refuses to run in
#     that state. Both lines were inherited verbatim from the Debian sample config, which ships
#     them commented out. Re-add cipher-type together with a cipher-pass sourced from a secret
#     store if encryption at rest is required.
#   - compress-type=zstd is not a valid value; the allowed set is none, bz2, gz, lz4, zst.
#   - repo1-path moved off the container's writable layer onto the pg_data volume (mounted at
#     /var/lib/postgresql) so the repository survives a container rebuild.
#
# Retention is deliberately small: this is a 32 MB pilot database on a 197 GB shared VPS that has
# already run out of disk once. The unbounded growth cause was archive_command copying WAL forever,
# not the repository, so a small retention is safe here.

[global]
log-level-console=info
log-level-file=detail
compress-type=zst
compress-level=3
start-fast=y
delta=y

[main]
repo1-path=/var/lib/postgresql/pgbackrest
repo1-retention-full=4
repo1-retention-diff=30
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=admin_user