# pgBackRest configuration for PRODUCTION (staging uses staging-basebackup.sh, ruling 2026-09-20).
# Corrected 2026-09-23. The earlier file had four faults: a `[main:pg1]` section (not valid; a
# stanza's pg1-* options go in the stanza section itself), the Debian data path instead of the
# postgres:18 image's `/var/lib/postgresql/18/docker`, `compress-type=zstd` (the value is `zst`),
# and a cipher type with no passphrase.
#
# The passphrase is NOT in this file. Set it in the environment of every pgbackrest call:
#   PGBACKREST_REPO1_CIPHER_PASS="$(cat /root/ims-pgbackrest-cipher.txt)"
# Generate it once with `openssl rand -base64 48`, keep a second copy OFF the box: a lost
# passphrase makes every backup in the repository unreadable.
#
# pgBackRest must run where it can read the data directory and where archive_command runs, so it
# is installed inside the postgres image, and archive_command in docker-compose.yml becomes
# `pgbackrest --stanza=main archive-push %p` for production.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=30
repo1-cipher-type=aes-256-cbc
log-level-console=info
log-level-file=detail
compress-type=zst
compress-level=3
start-fast=y
delta=y
process-max=2

# archive-push-queue-max is left unset on purpose: when the queue exceeds it pgBackRest DROPS WAL,
# which silently breaks point-in-time recovery. A full disk is louder and is caught by monitoring.

[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=admin_user
