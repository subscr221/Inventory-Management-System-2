services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      # Build-time only (VPS survey 2026-09-13): the staging box runs ufw with
      # DEFAULT_FORWARD_POLICY=DROP, which starves bridge-network build containers of DNS and
      # egress (npm ci failed EAI_AGAIN). Building on the host's network side-steps that without
      # touching ufw or the Docker daemon; the running containers stay on the bridge.
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: inventory_events
      DB_USER: app_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      # Auth + SCIM are validated at startup (src/config/index.ts). Under NODE_ENV=production the
      # app requires OIDC config and a SCIM bearer token; ${VAR:?...} makes `docker compose up`
      # fail with a clear message when one is missing instead of the container crash-looping.
      AUTH_MODE: oidc
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:?set AUTH_JWKS_URI to the IdP JWKS endpoint}
      AUTH_ISSUER: ${AUTH_ISSUER:?set AUTH_ISSUER to the IdP issuer}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?set AUTH_AUDIENCE to this API's audience}
      # Which token claim names the directory record (staging Keycloak: the email, so the roles
      # file's email IS the identity; default sub).
      AUTH_SUBJECT_CLAIM: ${AUTH_SUBJECT_CLAIM:-sub}
      SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:?set SCIM_BEARER_TOKEN to a long random secret}
      EDGE_SITE_NAME: ${EDGE_SITE_NAME:-Pilot Gate Site}
      POWERSYNC_URL: ${POWERSYNC_URL:-/powersync}
      POWERSYNC_TOKEN_ISSUER: ${POWERSYNC_TOKEN_ISSUER:-inventory-edge}
      POWERSYNC_TOKEN_AUDIENCE: ${POWERSYNC_TOKEN_AUDIENCE:-powersync}
      POWERSYNC_TOKEN_SECRET: ${POWERSYNC_TOKEN_SECRET:?set POWERSYNC_TOKEN_SECRET to a long random secret}
      POWERSYNC_TOKEN_TTL: ${POWERSYNC_TOKEN_TTL:-15m}
      POWERSYNC_TOKEN_KID: ${POWERSYNC_TOKEN_KID:-inventory-edge-hs256}
    ports:
      # Loopback only (round table 2026-09-13, public VPS): reachable from the host for the
      # health probe, never from the internet; nginx is the only public door.
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    networks:
      - backend

  edge:
    build:
      context: ../..
      dockerfile: edge/Dockerfile
      # Build-time only (VPS survey 2026-09-13): the staging box runs ufw with
      # DEFAULT_FORWARD_POLICY=DROP, which starves bridge-network build containers of DNS and
      # egress (npm ci failed EAI_AGAIN). Building on the host's network side-steps that without
      # touching ufw or the Docker daemon; the running containers stay on the bridge.
      network: host
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Story 1.12: the browser's sign-in config, served by the edge container at /auth/config
      # (read per request; never NEXT_PUBLIC_* because the image is promoted by digest). Same
      # fail-closed form as the app's AUTH_* above: the authority defaults to AUTH_ISSUER (itself
      # required) so the two cannot drift, and an existing .env needs no new variables.
      EDGE_AUTH_MODE: oidc
      EDGE_OIDC_AUTHORITY: ${EDGE_OIDC_AUTHORITY:-${AUTH_ISSUER:?set AUTH_ISSUER to the IdP issuer}}
      EDGE_OIDC_CLIENT_ID: ${EDGE_OIDC_CLIENT_ID:-ims-app}
    ports:
      # Loopback only; a host-level nginx (deploy/host-nginx) proxies to it when the stack's own
      # nginx is not started (VPS survey 2026-09-13: the box's nginx owns 80 and 443).
      - "127.0.0.1:${EDGE_HOST_PORT:-3001}:3000"
    networks:
      - backend

  powersync:
    image: journeyapps/powersync-service:1.23.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # powersync-service only substitutes YAML `!env` tags for vars prefixed "PS_" (see
      # sync/powersync.yaml) - these are deliberately separate from the app service's own
      # POWERSYNC_* vars below, which src/config/index.ts reads directly via process.env.
      PS_SOURCE_URI: postgresql://svc_powersync:${POWERSYNC_SOURCE_PASSWORD}@postgres:5432/inventory_events
      # PowerSync's storage backend creates and manages its own bookkeeping tables (locks,
      # migrations), which needs schema-level CREATE - app_user's narrow per-table grants
      # (init-db.sql) aren't enough. admin_user is this repo's existing DDL-privileged role
      # (already used for app migrations), so reuse it here instead of widening app_user.
      PS_STORAGE_URI: postgresql://admin_user:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/inventory_events
      PS_TOKEN_ISSUER: ${POWERSYNC_TOKEN_ISSUER:-inventory-edge}
      PS_TOKEN_AUDIENCE: ${POWERSYNC_TOKEN_AUDIENCE:-powersync}
      PS_TOKEN_SECRET: ${POWERSYNC_TOKEN_SECRET:?set POWERSYNC_TOKEN_SECRET to a long random secret}
      PS_TOKEN_KID: ${POWERSYNC_TOKEN_KID:-inventory-edge-hs256}
    volumes:
      - ../../sync/powersync.yaml:/config/powersync.yaml:ro
      - ../../sync/sync-rules.yaml:/config/sync-rules.yaml:ro
    # client_auth.jwks needs the shared secret as a base64url JWK `k`; derive it from the one
    # secret at start (the image ships node) instead of keeping a second encoded copy in .env.
    entrypoint:
      - sh
      - -c
      - >-
        PS_TOKEN_JWK_K="$$(node -e 'process.stdout.write(Buffer.from(process.env.PS_TOKEN_SECRET, "utf8").toString("base64url"))')"
        && export PS_TOKEN_JWK_K
        && exec node service/lib/entry.js start -c /config/powersync.yaml
    command: []
    ports:
      - "127.0.0.1:${POWERSYNC_HOST_PORT:-8080}:8080"
    networks:
      - backend

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_events
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Collation pin (deferred-work 432, applied 2026-09-13): a restore to a host with another
      # locale must not change lower() or ORDER BY semantics under the uniqueness checks. initdb
      # reads this on FIRST boot only; an existing volume keeps the locale it was created with.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
      # Read by init-role-passwords.sh on first boot: init-db.sql creates the four runtime roles
      # with placeholders, this replaces them (deferred-work 94, the SQL half, 2026-09-13).
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (app_user) to a long random secret}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?set READONLY_PASSWORD (readonly_user) to a long random secret}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD (replication_user) to a long random secret}
      POWERSYNC_SOURCE_PASSWORD: ${POWERSYNC_SOURCE_PASSWORD:?set POWERSYNC_SOURCE_PASSWORD (svc_powersync) to a long random secret}
      # Read by init-keycloak-db.sh on first boot to create Keycloak's own role and database.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD to a long random secret}
    volumes:
      # postgres:18+ images store data in a major-version-specific subdirectory under a
      # single /var/lib/postgresql mount (not /var/lib/postgresql/data directly) - see
      # https://github.com/docker-library/postgres/pull/1259
      - pg_data:/var/lib/postgresql
      - ./init-wal-archive.sh:/docker-entrypoint-initdb.d/00-init-wal-archive.sh
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      # Named 01-zz so it sorts AFTER 01-init-db.sql under every collation: the image's en_US
      # locale ignores punctuation and ran a "01b-" name before "01-init" (2026-09-13).
      - ./init-role-passwords.sh:/docker-entrypoint-initdb.d/01-zz-init-role-passwords.sh
      - ./init-pg-hba.sh:/docker-entrypoint-initdb.d/02-init-pg-hba.sh
      - ./init-keycloak-db.sh:/docker-entrypoint-initdb.d/03-init-keycloak-db.sh
    command:
      - "postgres"
      # IST pin (deferred-work 215/616, applied 2026-09-13): the server default matches the
      # session pin src/config/db.ts sets on every app connection, so psql and pgBackRest tooling
      # see the same calendar the application does.
      - "-c"
      - "timezone=Asia/Kolkata"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=cp %p /var/lib/postgresql/wal_archive/%f"
      - "-c"
      - "archive_timeout=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      # Attribute server-log lines to a session user and database: the server error log is the
      # designated durable record of direct-DB tamper attempts (see init-db.sql), and the default
      # prefix ('%m [%p] ') logs neither. log_connections gives PID-to-user correlation as backup.
      - "-c"
      - "log_line_prefix=%m [%p] user=%u db=%d "
      - "-c"
      - "log_connections=on"
    ports:
      # Loopback only (round table 2026-09-13): a database must never listen on a public interface.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d inventory_events"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot runs init-db.sql (14,000 lines), the role-password and Keycloak init scripts
      # before the server accepts connections; on the staging VPS that outran 10 x 5 s and the
      # dependents (keycloak, edge) were created but never started (2026-09-13). Failures inside
      # the start period do not count against retries.
      start_period: 120s
    networks:
      - backend

  postgres-standby:
    # Opt-in (`--profile ha`): a hot standby is a production concern; on the shared staging VPS it
    # would only cost memory (VPS survey 2026-09-13).
    profiles: ["ha"]
    image: postgres:18.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: replication_user
      PGPASSWORD: ${REPLICATION_PASSWORD}
      # postgres:18+ images default PGDATA to /var/lib/postgresql/18/docker, not the
      # /var/lib/postgresql/data path pg_basebackup -D writes to below and the volume mounts at.
      # Without this override docker-entrypoint.sh looks in the (empty) default dir and thinks
      # the cluster is uninitialized.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_standby_data:/var/lib/postgresql/data
    entrypoint: |
      bash -c "
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Initializing standby from primary...'
        pg_basebackup -h postgres -U replication_user -D /var/lib/postgresql/data -Fp -Xs -P -R
      fi
      exec docker-entrypoint.sh postgres -c 'hot_standby=on' -c 'timezone=Asia/Kolkata'
      "
    ports:
      - "127.0.0.1:${STANDBY_HOST_PORT:-5433}:5432"
    networks:
      - backend

  keycloak:
    # Staging identity provider (round table 2026-09-13): the platform refuses AUTH_MODE=local
    # outside development, and the company has no external identity provider, so Keycloak runs
    # on the same box behind nginx at https://auth.${PUBLIC_DOMAIN}. Realm "ims" and the public
    # client "ims-app" are imported from deploy/keycloak/realm-ims.json on every start (import is
    # idempotent for an existing realm). People are created in the Keycloak console with their
    # email as username; their hats come from deploy/provision/roles.json via provision:roles.
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD to a long random secret}
      KC_HOSTNAME: https://auth.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN, e.g. ancorlabs.org}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # First-boot admin only; rotate in the console after the first login.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD to a long random secret}
      # Heap cap (VPS survey 2026-09-13: 16 GB box with Elasticsearch already holding 8.5 GB).
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_JAVA_HEAP:--Xms128m -Xmx512m}
    volumes:
      - ../keycloak/realm-ims.json:/opt/keycloak/data/import/realm-ims.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080"
    networks:
      - backend

  nginx:
    # Opt-in (`--profile standalone`): only for a host with no web server of its own. The staging
    # VPS already runs nginx 1.24 on 80 and 443 with certbot; deploy/host-nginx carries the vhosts
    # that proxy to the loopback ports above instead.
    profiles: ["standalone"]
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
      - keycloak
    environment:
      # Substituted into nginx.conf.template by the image's envsubst step on start.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN, e.g. ancorlabs.org}
      # Certificate files as seen INSIDE the container. Staging: the Let's Encrypt live files under
      # the read-only /etc/letsencrypt mount below. Standalone hosts with a Cloudflare Origin CA
      # certificate point these at /etc/nginx/certs/origin.pem and origin.key instead.
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/origin.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/origin.key}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Cloudflare Origin CA certificate and key for *.${PUBLIC_DOMAIN}; git-ignored, placed by
      # the operator. Valid only behind the Cloudflare proxy.
      - ./certs:/etc/nginx/certs:ro
      # Let's Encrypt live files (symlinks resolve inside the mount). Staging VPS 2026-09-13.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      # Staging VPS: 80 and 443 belong to the panel's nginx; Cloudflare's Origin Rule targets
      # NGINX_HTTPS_HOST_PORT. A host that owns 80 and 443 sets both to their natural values.
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    networks:
      - backend

volumes:
  pg_data:
  pg_standby_data:

networks:
  backend:
    driver: bridge
